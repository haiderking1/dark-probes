name: image
# the probe image: windows 11 IoT enterprise LTSC (microsoft's evaluation
# ISO) installed unattended in KVM with the probe runner, kept in this
# repo's private actions cache; a smoke run checks the runner answers
on:
  push:
    paths: [.github/workflows/image.yml, image/**]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: kvm and tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf swtpm genisoimage socat zstd ntfs-3g > /dev/null
      - name: cached image
        id: cache
        uses: actions/cache@v4
        with:
          path: img
          key: win11-ltsc-26100-${{ hashFiles('image/answer/**', 'image/extras.txt', '.github/workflows/image.yml') }}
      - name: download the iso
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          url=$(curl -sIL -o /dev/null -w '%{url_effective}' 'https://go.microsoft.com/fwlink/?linkid=2270353&clcid=0x409&culture=en-us&country=us')
          echo "$url"
          case "$url" in https://software-static.download.prss.microsoft.com/*) ;; *) echo "not microsoft's server"; exit 1 ;; esac
          curl -sfL --retry 5 -o win.iso "$url"
          size=$(stat -c %s win.iso); echo "size $size"
          [ "$size" = 5060020224 ] || { echo "short download"; exit 1; }
          sha256sum win.iso
      - name: download the extras
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # room for the update next to the iso and the disk
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h .
          # what the reference machine has besides windows: microsoft's own
          # installers, each checked against the hash of the copy it ran
          mkdir -p extras/updates extras/dotnet
          echo 'dark probe image extras' > extras/extras.txt
          while read name hash url; do
            curl -sfL --retry 5 -o extras/$name "$url" || { echo "can't get $name"; exit 1; }
            case $name in
              *.msu) got=$(sha1sum extras/$name | cut -c1-40) ;;
              *) got=$(sha256sum extras/$name | cut -c1-64) ;;
            esac
            [ "$got" = "$hash" ] || { echo "$name is $got, not $hash"; exit 1; }
            echo "$name ok $(stat -c %s extras/$name)"
          done < image/extras.txt
          genisoimage -quiet -udf -allow-limited-size -J -r -o extras.iso extras
          rm -rf extras
          df -h .
      - name: install windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p img
          head -c 32 /dev/urandom > img/token
          cp img/token image/answer/token
          genisoimage -quiet -J -r -o answer.iso image/answer
          qemu-img create -f qcow2 img/win.qcow2 64G
          cp /usr/share/OVMF/OVMF_VARS_4M.fd img/vars.fd
          mkdir -p img/tpm
          swtpm socket --tpmstate dir=img/tpm --ctrl type=unixio,path=tpm.sock --tpm2 --daemon
          qemu-system-x86_64 -accel kvm -machine q35 -cpu host -smp 4 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=img/vars.fd \
            -chardev socket,id=chrtpm,path=tpm.sock -tpmdev emulator,id=tpm0,chardev=chrtpm -device tpm-tis,tpmdev=tpm0 \
            -device ahci,id=ahci \
            -drive file=img/win.qcow2,if=none,id=disk0,discard=unmap,detect-zeroes=unmap -device ide-hd,drive=disk0,bus=ahci.0,bootindex=2 \
            -drive file=win.iso,media=cdrom,if=none,id=cd0 -device ide-cd,drive=cd0,bus=ahci.1,bootindex=1 \
            -drive file=answer.iso,media=cdrom,if=none,id=cd1 -device ide-cd,drive=cd1,bus=ahci.2 \
            -drive file=extras.iso,media=cdrom,if=none,id=cd2 -device ide-cd,drive=cd2,bus=ahci.3 \
            -netdev user,id=n0 -device e1000e,netdev=n0 \
            -audiodev none,id=snd0 -device ich9-intel-hda -device hda-duplex,audiodev=snd0 \
            -vga std -display none -monitor unix:mon.sock,server,nowait &
          QEMU=$!
          # the cd's "press any key to boot" prompt
          for i in $(seq 1 30); do echo "sendkey spc" | timeout 1 socat - UNIX-CONNECT:mon.sock > /dev/null 2>&1 || true; sleep 1; done &
          # setup powers off after its third logon (update, .NET update, check);
          # the screen goes in shots/ every minute
          mkdir -p shots
          end=$((SECONDS + 17400))
          while kill -0 $QEMU 2>/dev/null; do
            [ $SECONDS -lt $end ] || { echo "install took too long"; kill $QEMU; sleep 5; exit 1; }
            sleep 30
            [ $((SECONDS / 30 % 2)) = 0 ] && echo "screendump shots/$(printf %04d $((SECONDS / 60))).png -f png" | timeout 5 socat - UNIX-CONNECT:mon.sock > /dev/null 2>&1 || true
            size=$(du -m img/win.qcow2 | cut -f1)
            echo "installing... $((SECONDS / 60)) min, disk $size MB"
            # a disk that hasn't moved in 25 minutes is a setup waiting on nothing
            [ "$size" = "$last" ] || { last=$size; moved=$SECONDS; }
            [ $((SECONDS - moved)) -lt 1500 ] || { echo "stuck: the disk hasn't changed in 25 minutes"; kill $QEMU; sleep 5; exit 1; }
          done
          qemu-img convert -c -O qcow2 img/win.qcow2 img/win2.qcow2 && mv img/win2.qcow2 img/win.qcow2
          du -h img/*
      - name: setup log
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo modprobe nbd max_part=8
          sudo qemu-nbd --read-only -c /dev/nbd0 img/win.qcow2 && sleep 2
          sudo mkdir -p /mnt/win
          for part in /dev/nbd0p3 /dev/nbd0p4 /dev/nbd0p2; do
            sudo mount -t ntfs-3g -o ro $part /mnt/win 2>/dev/null && break
          done
          sudo cat /mnt/win/dark/setup/setup.log || echo "no setup log"
          sudo cat /mnt/win/dark/run/setup.done 2>/dev/null || true
          sudo umount /mnt/win; sudo qemu-nbd -d /dev/nbd0
      - uses: actions/upload-artifact@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          name: shots
          path: shots
      - name: smoke run
        run: |
          swtpm socket --tpmstate dir=img/tpm --ctrl type=unixio,path=tpm.sock --tpm2 --daemon
          cp img/vars.fd vars-run.fd
          qemu-system-x86_64 -accel kvm -machine q35 -cpu host -smp 4 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars-run.fd \
            -chardev socket,id=chrtpm,path=tpm.sock -tpmdev emulator,id=tpm0,chardev=chrtpm -device tpm-tis,tpmdev=tpm0 \
            -device ahci,id=ahci -drive file=img/win.qcow2,if=none,id=disk0,snapshot=on -device ide-hd,drive=disk0,bus=ahci.0 \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:7777-:7777,hostfwd=tcp:127.0.0.1:7778-:7778 -device e1000e,netdev=n0 \
            -audiodev none,id=snd0 -device ich9-intel-hda -device hda-duplex,audiodev=snd0 \
            -vga std -display none &
          end=$((SECONDS + 900))
          until python3 image/winrun.py 7777 img/token 60000 smoke.out probes/ref_crypttime/ref_crypttime.exe 2>/dev/null; do
            [ $SECONDS -lt $end ] || { echo "runner never answered"; exit 1; }
            sleep 10
          done
          head -5 smoke.out
          rm -f extras.iso win.iso
          python3 image/winrun.py 7778 img/token 60000 smoke-e.out probes/ref_crypttime/ref_crypttime.exe
