name: probes
on:
  push:
  workflow_dispatch:
jobs:
  run:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: os
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.Version | Out-File os.txt
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR | Out-File -Append os.txt
          Get-Content os.txt
      - name: run probes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem probes -Filter *.exe | ForEach-Object {
            $name = $_.BaseName
            $work = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Force $work | Out-Null
            Copy-Item $_.FullName $work
            $p = Start-Process -FilePath (Join-Path $work $_.Name) -WorkingDirectory $work -NoNewWindow -PassThru `
                 -RedirectStandardOutput "out/$name.out" -RedirectStandardError "out/$name.err"
            if (-not $p.WaitForExit(300000)) { $p.Kill(); "$name timeout" | Add-Content out/codes.txt }
            else { "$name $($p.ExitCode)" | Add-Content out/codes.txt }
          }
          Get-Content out/codes.txt
          Copy-Item os.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: out
